server {
  host = "0.0.0.0"
  port = 8080
  timeout = 40 seconds
}

database {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://localhost:5444/carmine"
  url = ${?DATABASE_URL}
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "postgres"
  password = ${?DATABASE_PASSWORD}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  car-events-topic = "carmine-cars"
  car-events-topic = ${?KAFKA_CAR_TOPIC}
  maintenance-events-topic = "carmine-maintenances"
  maintenance-events-topic = ${?KAFKA_MAINTENANCE_TOPIC}
  retries = 3
  retries = ${?KAFKA_RETRIES}
}