datastax-java-driver.advanced.reconnect-on-init = true

akka {
  loglevel = "DEBUG"

  http {
    server {
      # The default value of the `Server` header to produce if no
      # explicit `Server`-header was included in a response.
      server-header = akka-http/${akka.http.version}

      # The time after which an idle connection will be automatically closed.
      idle-timeout = 60s

      # Defines the default request-timeout
      request-timeout = 20s

      # The time period within which the TCP binding process must be completed.
      bind-timeout = 1s
    }
  }

  # Dispatcher configuration
  dispatchers {
    # Dispatcher for Akka HTTP
    http-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
  }

  persistence {
    journal {
      plugin = "akka.persistence.cassandra.journal"
      auto-start-journals = ["akka.persistence.cassandra.journal"]
    }

    snapshot-store {
      plugin = "akka.persistence.cassandra.snapshot"
    }

    cassandra {
      journal {
        keyspace = "akka"
        table = "messages"
        keyspace-autocreate = true
        tables-autocreate = true

        # Write consistency level
        write-consistency = "QUORUM"
        read-consistency = "QUORUM"
      }

      snapshot {
        keyspace = "akka_snapshot"
        table = "snapshots"
        keyspace-autocreate = true
        tables-autocreate = true
      }
    }
  }

  actor {
    allow-java-serialization = on
    serializers {
      jackson-json = "akka.serialization.jackson.JacksonJsonSerializer"
    }

    serialization-bindings {
      "akka.persistence.PersistentActor" = jackson-json
      "akka.persistence.SnapshotMetadata" = jackson-json

      # Custom model bindings
      "com.github.scala_training.persistence.model.car.Car" = jackson-json
      "com.github.scala_training.persistence.command.car.Command" = jackson-json
      "com.github.scala_training.persistence.event.car.Event" = jackson-json
      "com.github.scala_training.persistence.model.State" = jackson-json

      "com.github.scala_training.persistence.model.maintenance.Maintenance" = jackson-json
      "com.github.scala_training.persistence.command.maintenance.Command" = jackson-json
      "com.github.scala_training.persistence.event.maintenance.Event" = jackson-json

      # Command Response bindings
      "com.github.scala_training.persistence.command.CommandResponse" = jackson-json
      "com.github.scala_training.persistence.command.CommandResponse$Success" = jackson-json
      "com.github.scala_training.persistence.command.CommandResponse$Failure" = jackson-json

      # Enum bindings
      "com.github.scala_training.domain.enums.MaintenanceStatus" = jackson-json
      "com.github.scala_training.domain.enums.MaintenanceType" = jackson-json
    }

    # Jackson-specific settings
    serialization-jackson {
      jackson-modules += "com.fasterxml.jackson.module.scala.DefaultScalaModule"
      jackson-modules += "com.fasterxml.jackson.datatype.jsr310.JavaTimeModule"

      # Needed for Scala 3 enums
      jackson-modules += "com.fasterxml.jackson.module.scala.DefaultEnumModule"
    }

    # Default dispatcher
    default-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 3.0
        parallelism-max = 64
      }
      throughput = 5
    }
  }
}